name: Deploy Azure VNets (Terraform)

on:
  push:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'terraform/**'
  workflow_dispatch: {}

permissions:
  id-token: write   # required to fetch the OIDC token
  contents: read     # required to check out the repo
  pull-requests: write # optional, lets the plan be posted as a PR comment

env:
  TF_WORKING_DIR: terraform
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

jobs:
  terraform:
    name: Terraform Plan/Apply
    runs-on: ubuntu-latest
    environment: production   # optional: gives you a manual approval gate
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_SA }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=vnet-cicd.tfstate"

      - name: Terraform upgrade
        run: terraform init -upgrade
        
      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate
  
      - name: Terraform Plan
        id: plan
        run: terraform plan -out=tfplan -input=true

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform apply -auto-approve -input=false tfplan ##added the comment 2

      - name: Show repository structure
        run: |
          pwd
          ls -la
          find . -type f

      - name: Generate inventory
        run: |
          APP_IP=$(terraform output -raw app_public_ip)
          DB_IP=$(terraform output -raw db_public_ip)

          mkdir -p ../ansible

          cat > ../ansible/inventory.ini <<EOF
          [app]
          $APP_IP ansible_user=azureuser

          [db]
          $DB_IP ansible_user=azureuser
          EOF
      - name: Read Terraform outputs
        run: |
          echo "APP_IP=$(terraform output -raw app_public_ip)" >> $GITHUB_ENV
          echo "DB_IP=$(terraform output -raw db_public_ip)" >> $GITHUB_ENV
          
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/azure_vm_key
          chmod 600 ~/.ssh/azure_vm_key

      - name: Show repository structure
        run: |
          pwd
          ls -la
          find . -type f

      - name: Add hosts to known_hosts
        run: |
          ssh-keyscan ${APP_IP} >> ~/.ssh/known_hosts
          ssh-keyscan ${DB_IP} >> ~/.ssh/known_hosts
      - name: Install Ansible
        run: |
          python3 -m pip install "ansible-core<2.18"
          
      - name: Execute playbook
        working-directory: ${{ github.workspace }}
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/site.yml \
            --private-key ~/.ssh/azure_vm_key